name: CD - Deploy no GitHub Pages

# Etapa 2: Dispara sempre que houver código novo aprovado na branch main
on:
  push:
    branches:
      - main

# Etapa 2: Permissões necessárias para publicar no GitHub Pages e abrir Issue em caso de falha
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Etapa 4: Notificação automática caso o deploy falhe
      - name: Notificar equipe em caso de falha no Deploy
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 ALERTA DEVOPS: Falha no Deploy de Produção!',
              body: `O deploy para o GitHub Pages falhou no commit \`${context.sha}\`.\n\n**Autor:** @${context.actor}\n**Logs da execução:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });