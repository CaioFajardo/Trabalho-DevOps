name: CI - Validação de Código (PR)

on:
  pull_request:
    branches:
      - main

jobs:
  validar-projeto:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar existência do index.html na raiz
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERRO CRÍTICO: O arquivo index.html não foi encontrado na raiz!"
            exit 1
          fi
          echo "OK: index.html encontrado."

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar HTML Linter
        run: npx htmlhint index.html

      - name: Verificar limite de tamanho de arquivos (Max 500KB)
        run: |
          ARQUIVOS_GRANDES=$(find . -type f -not -path "./node_modules/*" -not -path "./.git/*" -size +500k)
          if [ -n "$ARQUIVOS_GRANDES" ]; then
            echo "ERRO: Os seguintes arquivos excedem o limite de 500KB:"
            echo "$ARQUIVOS_GRANDES"
            exit 1
          fi
          echo "OK: Todos os arquivos estão dentro do limite de 500KB."

      - name: Varrer código em busca de comentários pendentes ou termos sensíveis
        run: |
          if grep -rnIiE "TODO|FIXME|senha|password" . --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.github --exclude=package-lock.json --exclude=package.json; then
            echo "ERRO: Foram encontrados termos proibidos (TODO, FIXME, senha ou password) no código!"
            exit 1
          fi
          echo "OK: Nenhum termo proibido encontrado."

      - name: Validar links e caminhos de imagens
        run: npx linkinator index.html --retry